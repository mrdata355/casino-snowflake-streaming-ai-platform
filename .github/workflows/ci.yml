name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check local_demo services scripts tests --output-format=concise
      - run: python -m compileall local_demo services scripts tests
      - name: Run credential-free tests and core coverage gate
        run: pytest -q --cov=local_demo --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Validate contracts and Snowflake templates
        run: python scripts/validate_env.py --template-mode
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
