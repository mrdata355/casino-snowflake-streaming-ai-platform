name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install credential-free developer dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint credential-free Python
        run: ruff check local_demo services scripts tests
      - name: Compile credential-free Python
        run: python -m compileall -q local_demo services scripts tests
      - name: Validate contracts and Snowflake templates without credentials
        run: python scripts/validate_env.py --template-mode
      - name: Run deterministic tests and enforce core coverage
        env:
          APP_ENV: test
        run: pytest -q --cov=local_demo --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Validate Terraform formatting and configuration
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
