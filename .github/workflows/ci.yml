name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        id: ruff
        continue-on-error: true
        run: ruff check local_demo services scripts tests --output-format=concise 2>&1 | tee ruff-output.txt
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
      - name: Enforce lint result
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - run: python -m compileall local_demo services scripts tests
      - run: pytest -q --cov=local_demo --cov=services --cov=scripts --cov-report=term-missing --cov-fail-under=85
      - name: Validate contracts and Snowflake templates
        run: python scripts/validate_env.py --template-mode
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
