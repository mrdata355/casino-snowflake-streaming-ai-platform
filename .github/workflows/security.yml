name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Capture dependency audit diagnostics
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit -r requirements-dev.txt 2>&1 | tee pip-audit-output.txt
      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-diagnostics
          path: pip-audit-output.txt
          if-no-files-found: error
      - name: Enforce dependency audit gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
