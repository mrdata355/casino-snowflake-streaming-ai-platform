name: Bootstrap production platform

on:
  push:
    branches:
      - feat/production-platform-v1
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-platform-v1
          fetch-depth: 0

      - name: Reconstruct and unpack validated source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part_*.txt > /tmp/casino-platform.tar.gz.b64
          base64 --decode /tmp/casino-platform.tar.gz.b64 > /tmp/casino-platform.tar.gz
          tar -xzf /tmp/casino-platform.tar.gz -C .
          rm -rf bootstrap

      - name: Commit production platform source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat(platform): publish production casino lakehouse reference implementation"
          git push origin HEAD:feat/production-platform-v1
