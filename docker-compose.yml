services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mlflow']
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    volumes:
      - mlartifacts:/mlartifacts

  feature-api:
    build:
      context: .
      dockerfile: services/feature_api/Dockerfile
    environment:
      APP_ENV: local
      AUTH_DISABLED: 'true'
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  mssql:
    profiles: ['sandbox']
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local environment}
    ports:
      - '1433:1433'
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 18

  sandbox-gateway:
    profiles: ['sandbox']
    build:
      context: .
      dockerfile: services/sandbox_gateway/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      OPSREADY_CORS_ORIGINS: ${OPSREADY_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,https://casino-snowflake-streaming-ai-platf-five.vercel.app}
      OPSREADY_ALLOW_ADMIN_LABS: ${OPSREADY_ALLOW_ADMIN_LABS:-false}
      OPSREADY_SESSION_TTL_MINUTES: ${OPSREADY_SESSION_TTL_MINUTES:-60}
      SQLSERVER_HOST: mssql
      SQLSERVER_PORT: '1433'
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local environment}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-OPSREADY_TRAINER}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-OPSREADY_WH}
      SNOWFLAKE_TRAINING_DATABASE: ${SNOWFLAKE_TRAINING_DATABASE:-OPSREADY_TRAINING}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_SQL_WAREHOUSE_ID: ${DATABRICKS_SQL_WAREHOUSE_ID:-}
      DATABRICKS_TRAINING_CATALOG: ${DATABRICKS_TRAINING_CATALOG:-opsready_training}
      DATABRICKS_CLUSTER_ID: ${DATABRICKS_CLUSTER_ID:-}
    ports:
      - '8090:8090'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mlartifacts:
